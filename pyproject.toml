[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3py-safe4"
version = "0.0.1"
description = "Safe4 extension API for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["web3", "safe4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "web3>=6.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/SAFE-anwang/web3py-safe4"
Repository = "https://github.com/SAFE-anwang/web3py-safe4"

[tool.setuptools.packages.find]
where = ["src"]
include = ["safe4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=safe4 --cov-report=term-missing"